<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaSentry AI | Password Recovery</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #071b36, #123e63);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}
.container {
    background: white;
    color: #172b45;
    width: 90%;
    max-width: 420px;
    padding: 30px;
    border-radius: 18px;
    box-sizing: border-box;
    text-align: center;
    box-shadow: 0 10px 35px rgba(0,0,0,.3);
}
h2 { color: #123e63; }
input {
    width: 100%;
    padding: 13px;
    margin: 10px 0;
    box-sizing: border-box;
    border: 1px solid #ccd5df;
    border-radius: 8px;
}
button {
    width: 100%;
    padding: 14px;
    background: #087f8c;
    color: white;
    border: none;
    border-radius: 8px;
    margin-top: 12px;
    font-weight: bold;
    cursor: pointer;
}
button:disabled { opacity: .6; }
#message {
    margin-top: 15px;
    overflow-wrap: anywhere;
}
.hidden { display: none; }
.small {
    color: #667788;
    font-size: 13px;
}
</style>
</head>

<body>
<div class="container">

<h2>PharmaSentry AI</h2>
<p class="small">Secure Account Recovery</p>

<div id="requestBox">
    <h3>Forgot Password?</h3>
    <p>Enter your registered email address.</p>

    <input id="email" type="email"
           placeholder="Registered email address">

    <button id="sendButton">Send Reset Link</button>
</div>

<div id="updateBox" class="hidden">
    <h3>Create New Password</h3>

    <input id="password" type="password"
           placeholder="New password (minimum 8 characters)">

    <input id="confirmPassword" type="password"
           placeholder="Confirm new password">

    <button id="updateButton">Update Password</button>
</div>

<p id="message"></p>

<p class="small">
PharmaSentry AI<br>
Developed by Dr. Praveen R Biradar
</p>

</div>

<script type="module">
import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://kzxikszpzkxthyetnbqr.supabase.co";

// Replace this placeholder with your Supabase PUBLISHABLE KEY.
const SUPABASE_KEY = "sb_publishable_MGsg-YkqshJgafQyx_F49g_BAISVYsr";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            flowType: "implicit",
            detectSessionInUrl: true,
            persistSession: true,
            autoRefreshToken: true
        }
    }
);

const requestBox = document.getElementById("requestBox");
const updateBox = document.getElementById("updateBox");
const message = document.getElementById("message");

function showUpdateScreen() {
    requestBox.classList.add("hidden");
    updateBox.classList.remove("hidden");
    message.textContent =
        "Recovery verified. Please create your new password.";
}

supabase.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY" && session) {
        showUpdateScreen();
    }
});

document.getElementById("sendButton").onclick =
async function () {
    const email = document.getElementById("email").value.trim();
    const button = this;

    if (!email) {
        message.textContent = "Please enter your email.";
        return;
    }

    button.disabled = true;
    message.textContent = "Sending reset email...";

    try {
        const { error } =
        await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.href.split("?")[0]
        });

        if (error) throw error;

        message.textContent =
        "If this email is registered, a password reset link will be sent. Check your inbox.";

    } catch (error) {
        message.textContent = error.message;
    } finally {
        button.disabled = false;
    }
};

document.getElementById("updateButton").onclick =
async function () {
    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password.length < 8) {
        message.textContent =
            "Password must contain at least 8 characters.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
    }

    this.disabled = true;
    message.textContent = "Updating password...";

    try {
        const { data: { session }, error: sessionError } =
            await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        if (!session) {
            throw new Error(
                "Recovery session missing. Please request a fresh reset link."
            );
        }

        const { error } = await supabase.auth.updateUser({
            password: password
        });

        if (error) throw error;

        message.textContent =
            "Password updated successfully! You can now sign in.";

        await supabase.auth.signOut();

        requestBox.classList.remove("hidden");
        updateBox.classList.add("hidden");

    } catch (error) {
        message.textContent = error.message;
    } finally {
        this.disabled = false;
    }
};
</script>

</body>
</html>
