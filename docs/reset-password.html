
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PharmaSentry AI - Password Recovery</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#071b36,#176080);
}
.card {
    width: 90%;
    max-width: 420px;
    padding: 28px;
    box-sizing: border-box;
    border-radius: 18px;
    background: white;
    color: #17324d;
    text-align: center;
}
h2 { color: #123e63; }
input {
    width: 100%;
    padding: 13px;
    margin: 9px 0;
    box-sizing: border-box;
    border: 1px solid #ccd5df;
    border-radius: 8px;
}
button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 0;
    border-radius: 8px;
    background: #087f8c;
    color: white;
    font-weight: bold;
}
#message {
    overflow-wrap: anywhere;
    font-size: 14px;
}
.hidden { display: none; }
.small { color: #718096; font-size: 12px; }
</style>
</head>

<body>
<div class="card">

<h2>PharmaSentry AI</h2>
<p class="small">Secure Password Recovery</p>

<div id="loading">Checking recovery link...</div>

<div id="resetBox" class="hidden">
    <h3>Create New Password</h3>

    <input id="password" type="password"
        placeholder="New password (minimum 8 characters)">

    <input id="confirmPassword" type="password"
        placeholder="Confirm new password">

    <button id="updateButton">Update Password</button>
</div>

<p id="message"></p>

<p class="small">
Developed by Dr. Praveen R Biradar
</p>

</div>

<script type="module">
import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
"https://kzxikszpzkxthyetnbqr.supabase.co";

// Use your existing Supabase PUBLISHABLE KEY.
const SUPABASE_KEY = "const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            flowType: "implicit",
            detectSessionInUrl: true,
            persistSession: true,
            autoRefreshToken: true
        }
    }
);

const loading = document.getElementById("loading");
const resetBox = document.getElementById("resetBox");
const message = document.getElementById("message");

async function initializeRecovery() {
    try {
        // Allow Supabase to process the recovery URL.
        const { data, error } =
            await supabase.auth.getSession();

        if (error) throw error;

        if (data.session &&
            data.session.user) {
            loading.classList.add("hidden");
            resetBox.classList.remove("hidden");
            message.textContent =
                "Recovery verified. Enter your new password.";
        } else {
            throw new Error(
                "Recovery session not found. Please request a fresh reset email."
            );
        }
    } catch (error) {
        loading.classList.add("hidden");
        message.textContent = error.message;
    }
}

document.getElementById("updateButton").onclick =
async function () {

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password.length < 8) {
        message.textContent =
            "Password must contain at least 8 characters.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent =
            "Passwords do not match.";
        return;
    }

    this.disabled = true;
    message.textContent = "Updating password...";

    try {
        const { data: { session } } =
            await supabase.auth.getSession();

        if (!session) {
            throw new Error("Recovery session expired. Request a new link.");
        }

        const { error } =
            await supabase.auth.updateUser({
                password: password
            });

        if (error) throw error;

        await supabase.auth.signOut();

        resetBox.classList.add("hidden");
        message.textContent =
            "Password updated successfully! You can now return to PharmaSentry AI and sign in.";

    } catch (error) {
        message.textContent = error.message;
    } finally {
        this.disabled = false;
    }
};

initializeRecovery();
</script>
</body>
</html>
