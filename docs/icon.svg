
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101D35"/>
      <stop offset="100%" stop-color="#263E5B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3DFA9"/>
      <stop offset="100%" stop-color="#B9904D"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Pharmaceutical shield -->
  <path d="M256 35 L410 95 V205
           C410 285 345 345 256 385
           C167 345 102 285 102 205
           V95 Z"
        fill="none"
        stroke="url(#gold)"
        stroke-width="8"
        stroke-linejoin="round"/>

  <!-- PB initials -->
  <text x="256" y="190"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="142"
        font-weight="bold"
        fill="url(#gold)">PB</text>

  <!-- Divider -->
  <path d="M155 220 H357"
        stroke="url(#gold)"
        stroke-width="3"/>

  <!-- Full application name inside shield -->
  <text x="256" y="270"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="27"
        font-weight="bold"
        letter-spacing="1"
        textLength="260"
        lengthAdjust="spacingAndGlyphs"
        fill="#F5EBD6">PHARMASENTRY AI</text>

  <text x="256" y="305"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="13"
        letter-spacing="2"
        fill="#E5CA8A">PHARMACOVIGILANCE</text>

  <!-- Creator name below the shield -->
  <text x="256" y="445"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="24"
        font-style="italic"
        fill="#F3DFA9">Dr. Praveen R Biradar</text>

</svg>
